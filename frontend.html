    <!-- JavaScript to connect to the backend -->
    <script>
      document.addEventListener('DOMContentLoaded', () => {
        // Get references to the input fields and the button
        const xPosInput = document.getElementById('x-pos');
        const yPosInput = document.getElementById('y-pos');
        const zPosInput = document.getElementById('z-pos');
        const rxInput = document.getElementById('rx');
        const ryInput = document.getElementById('ry');
        const rzInput = document.getElementById('rz');
        const calculateBtn = document.getElementById('calculate-btn');
        const resultTable = document.getElementById('result-table').getElementsByTagName('tbody')[0];

        // Add a click event listener to the "Calculate Matrix" button
        calculateBtn.addEventListener('click', () => {
          // Create the data payload to send to the backend
          const data = {
            x: xPosInput.value,
            y: yPosInput.value,
            z: zPosInput.value,
            rx: rxInput.value,
            ry: ryInput.value,
            rz: rzInput.value
          };

          // Send a POST request to the /calculate endpoint
          fetch('http://localhost:5000/calculate', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
            },
            body: JSON.stringify(data),
          })
          .then(response => response.json())
          .then(matrix => {
            // Check if the backend returned an error
            if (matrix.error) {
              console.error('Error:', matrix.error);
              alert('An error occurred: ' + matrix.error);
              return;
            }
            // Update the result table with the new matrix values
            updateTable(matrix);
          })
          .catch((error) => {
            console.error('Error:', error);
            alert('Failed to connect to the calculation server.');
          });
        });

        // Function to update the HTML table with the calculated matrix
        function updateTable(matrix) {
          // There are 4 rows in the table body
          for (let i = 0; i < 4; i++) {
            // There are 5 cells per row (label + 4 values)
            const cells = resultTable.rows[i].cells;
            for (let j = 1; j < 5; j++) {
                // Update cell content, formatting numbers to 4 decimal places
                cells[j].textContent = matrix[i][j-1].toFixed(4);
            }
          }
        }
      });
    </script>
